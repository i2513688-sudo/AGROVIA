<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar | AGROVIA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='pages.css') }}">
</head>
<body class="account-page">
  <main class="account-layout">
    <section class="account-intro">
      <a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">A</span><span>AGROVIA</span></a>
      <div><div class="eyebrow">Mercado directo</div><h1>Vuelve a conectar<br><em>con el campo.</em></h1><p>Gestiona tus compras, solicitudes y lotes desde un solo lugar.</p></div>
      <img src="{{ url_for('static', filename='images/choclo.png') }}" alt="Choclo fresco">
    </section>
    <section class="account-card">
      <a class="back-link" href="{{ url_for('home') }}">← Volver al mercado</a>
      <div class="modal-kicker">AGROVIA / CUENTA</div>
      <h2>Iniciar sesión</h2>
      <p class="account-muted">Ingresa para gestionar tus compras y lotes.</p>
      <form data-auth-form="login">
        <label>Correo electrónico<input name="email" type="email" placeholder="tu@correo.com" required></label>
        <label>Contraseña<input name="password" type="password" placeholder="Tu contraseña" required></label>
        <div class="form-error" data-error></div>
        <button class="primary-button full" type="submit">Ingresar <span>↗</span></button>
      </form>
      <p class="account-switch">¿Aún no tienes cuenta? <a href="{{ url_for('register_page') }}">Crear una cuenta</a></p>
      <p class="demo-hint">Demo: demo@agrovia.co / demo123</p>
    </section>
  </main>
  <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
