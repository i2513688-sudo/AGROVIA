{% extends "base.html" %}{% block content %}<main class="container"><h1>Usuarios</h1><div class="card"><table class="table"><tr><th>Código</th><th>Nombre</th><th>Documento</th><th>Correo</th><th>Roles</th><th>Estado</th></tr>{% for u in users %}<tr><td>{{ u.codigo_usuario }}</td><td>{{ u.nombres }} {{ u.apellido_paterno or '' }}</td><td>{{ u.numero_documento }}</td><td>{{ u.correo or '-' }}</td><td>{{ u.roles or '-' }}</td><td>{{ u.estado }}</td></tr>{% endfor %}</table></div></main>{% endblock %}
